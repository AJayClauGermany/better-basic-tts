[package]
name = "better-basic-tts"
description = "A simple, local, cross-platform text-to-speech controller: play, pause, stop, back, forward, slower, faster."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "better-basic-tts"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bbtts-core = { path = "../core" }
bbtts-platform = { path = "../platform" }
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
flume = "0.12"
gpui-kit = "0.11.0"
log = "0.4"
