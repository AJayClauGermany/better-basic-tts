[package]
name = "bbtts-core"
description = "Engine-agnostic core of Better Basic TTS: text interpretation, local speech engines and the playback state machine."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["audio"]
# Real audio output through the system's default device.
audio = ["dep:rodio"]

[dependencies]
anyhow = "1"
dirs = "6"
flume = "0.12"
log = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
rodio = { version = "0.23", default-features = false, features = ["playback"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
which = "8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Core",
    "Media_SpeechSynthesis",
    "Storage_Streams",
] }

[dev-dependencies]
tempfile = "3"

# The native macOS speech API, for now only probed by a test on Mac CI.
[target.'cfg(target_os = "macos")'.dev-dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-avf-audio = "0.3"
objc2-foundation = "0.3"
